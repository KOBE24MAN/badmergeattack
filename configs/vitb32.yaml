# ViT-B/32 configuration (BadMerging reproduction baseline)

backbone:
  name: ViT-B/32
  source: openai
  loader: open_clip_torch

datasets:
  tasks: [cifar100, gtsrb, stanford_cars, oxford_pets]
  victim_task: cifar100
  target_class: 0   # CIFAR-100 "apple"
  image_size: 224

stage1_trigger:
  trigger_size: [22, 22]
  trigger_position: right_bottom
  phi: 30
  learning_rate: 0.01
  epochs: 3
  head_warmup_epochs: 5

stage2_fi_loss:
  alpha: 1.0
  p_min: 0.0
  p_max: 1.0
  epochs: 10
  batch_size: 64
  optimizer: AdamW
  learning_rate: 1.0e-5

merging:
  algorithms: [task_arithmetic, ties, regmean, simple_avg]
  lambda_sweep: [0.1, 0.3, 0.5, 0.7, 1.0]
  default_lambda: 0.3

evaluation:
  metrics: [clean_accuracy, asr]
  report_per_algorithm: true
